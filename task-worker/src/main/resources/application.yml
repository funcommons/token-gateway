server:
  port: 9411

spring:
  application:
    name: token-gateway-task-worker

# lotask4j 平台对接 (worker 域; 与网关共用租户凭证, 环境变量注入禁入仓)
token-gateway:
  task:
    lotask:
      url: ${LOTASK_URL:http://localhost:8080}
      auth: jwt
      tenant-name: ${LOTASK_TENANT_NAME:}
      jwt-secret: ${LOTASK_JWT_SECRET:}
      access-key: ${LOTASK_ACCESS_KEY:}
      sign-key: ${LOTASK_SIGN_KEY:}
    snapshot-cipher-key: ${TGW_SNAPSHOT_CIPHER_KEY:}   # 与网关同钥 (路由快照解密)

worker:
  # id: wkr-xxx                       # 默认启动生成 wkr-<uuid8>
  poll-interval: 5s                   # 拉单节拍
  upstream-poll-interval: 5s          # 脚本 poll 钩子循环节拍
  scripts-dir: ${WORKER_SCRIPTS_DIR:scripts}
  concurrency: 8
  status-check-every: 3               # 每 3 次上游轮询查一次取消信号
  hook-timeout: 60s                   # 单钩子执行硬上限
  max-task-duration: 3h               # 单任务最大时长 (网关超时钟另有兜底)
  egress-allowlist: ${WORKER_EGRESS_ALLOWLIST:}   # 逗号分隔 url 前缀; 空 = 全禁 (fail-closed)

  # 脚本源 (issue #9): local = 本地目录扫描 (默认, 现状行为不变);
  # remote = 控制层回调索取 (MMagiX 转接形态, 脚本真源 mmxp_model_script).
  # remote 契约: GET {base-url}/{taskType} → {version, hooks}; 成功落本地副本
  # (<scriptsDir>/.cache/), 控制层不可达降级用副本 + WARN; base-url/task-types
  # 缺失启动 fail-fast. 鉴权 X-Internal-Token env 注入禁入仓.
  script-source: ${WORKER_SCRIPT_SOURCE:local}
  # script-remote:
  #   base-url: http://mmagix:9400/api/v1/internal/work-scripts
  #   internal-token: ${MMAGIX_INTERNAL_TOKEN:}
  #   task-types: [video, image, tts]   # remote 无列表端点, 显式声明
  #   cache-ttl: 60s                     # 版本比对节流 (窗口内不发 HTTP; 过期拉取比对)

logging:
  level:
    root: INFO
    fun.commons.tokengateway: INFO
    script: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
