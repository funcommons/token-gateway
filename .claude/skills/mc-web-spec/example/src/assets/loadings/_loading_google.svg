<circle cx="25" cy="25" r="20" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-dasharray="1, 200" stroke-dashoffset="0">
  <animateTransform attributeName="transform" type="rotate" from="0 25 25" to="360 25 25" dur="1.4s" repeatCount="indefinite"/>
  <animate attributeName="stroke-dasharray" values="1,200;90,200;90,200" keyTimes="0;0.5;1" dur="1.4s" repeatCount="indefinite"/>
  <animate attributeName="stroke-dashoffset" values="0;-35;-124" keyTimes="0;0.5;1" dur="1.4s" repeatCount="indefinite"/>
</circle>
