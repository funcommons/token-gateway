openapi: 3.0.3
info:
  title: token-gateway Capability-Face Contract（后端能力面契约）
  version: 1.0.0
  description: |
    后端接入 token-gateway 需实现本契约（服务端角色；网关是客户端）。语言不限：
    Go / Python / Node / Java 实现这些 HTTP 端点即可，网关以 `adapter: openapi` 调用。
    接入手册见 docs/开发文档/02_后端接入开发手册.md。

    注意文件内含两种形态：`/gw/v1/*` 为 openapi 适配器契约（本文件主体）；
    文末另有「Mmagix 形态内部 API」独立区块（`/api/v1/internal/channels/*` 健康上报，
    网关经 route 面硬编码调用的历史路径），两种形态以注释标头隔离，勿混用。

    通用规则（违反 = 接入验收不过）：
    - 所有响应 HTTP 200 + 6 字段信封（code/message/data/error/trace_id/timestamp）；
      业务错误在 code（10202 凭证 / 10400 无路由 / 10617 余额 / 101xx 参数），
      禁用 5xx 表达业务错误——5xx/超时会被网关判为基础设施故障并触发重试或 saga 补偿。
    - 请求头 X-Trace-Id 必须透传，并回填信封 trace_id 同值。
    - settle / refund / access-log / audit 必须幂等（重复请求返回首次结果）。
    - 鉴权四式 none | key | jwt | token 由网关 yml 逐能力面配置；服务端校验方法见手册 §3.4。
    - 访问日志可选 MQ 通道（kafka | rocketmq，topic 默认 token-gateway-access-log，
      消息体与 AccessLogEntry 同构 + gw_sent_at，at-least-once，按 (trace_id, ts) 幂等消费）
      ——MQ 契约无法用 OpenAPI 表达，见手册 §5。
servers:
  - url: https://your-backend.example.com
    description: 你的后端（按需实现下列端点的子集）
tags:
  - name: token
    description: 凭证校验
  - name: route
    description: 路由分发
  - name: billing
    description: 计费三件套（saga）
  - name: moderation
    description: 内容审核
  - name: log
    description: 日志与审计
  - name: models
    description: 模型目录
  - name: task
    description: 任务委托面（可选；仅后端自持任务状态时实现。哑上游任务 API 无需实现——网关本地状态机经 route 面驱动）
  - name: channel-health
    description: 渠道健康上报（Mmagix 形态内部 API，网关→控制层方向；与 /gw/v1/* 适配器契约不同形，见文末独立区块）
security:
  - apiKeyHeader: []
  - bearerJwt: []
  - internalTokenHeader: []

paths:
  /gw/v1/token/validate:
    post:
      tags: [token]
      operationId: validateToken
      summary: 凭证校验（高频热点面，建议 60s 级本地缓存）
      parameters:
        - $ref: '#/components/parameters/TraceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [credential]
              properties:
                credential:
                  type: string
                  description: 调用方原始凭证（网关原样转交）
                client_ip:
                  type: string
                  description: |
                    调用方客户端 IP（issue #27）。由网关按信任代理策略解析，见安全契约「客户端 IP 解析」节：
                    `gateway.client-ip.trusted-proxies=0`（默认）恒取 TCP 对端地址；
                    >0 时从 X-Forwarded-For 右起跳过 N 个可信代理后取第一个，缺失/耗尽/畸形回退 TCP 对端。
                    客户端可伪造 XFF 首位，服务端不得自行从请求头解析客户端 IP。
      responses:
        '200':
          description: 校验结果（无效凭证也是 200 + code=10202）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/TokenContextData'

  /gw/v1/route/resolve:
    post:
      tags: [route]
      operationId: resolveRoute
      summary: 路由解析（模型 → 上游候选，等价旧 distribute）
      parameters:
        - $ref: '#/components/parameters/TraceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [model]
              properties:
                model:
                  type: string
                tenant_id:
                  type: string
                  description: 调用方租户（token-validate 的 tenant_id），缺省 0
                request_id:
                  type: string
                  description: 请求级幂等/分桶键
                client_ip:
                  type: string
                  description: |
                    调用方客户端 IP（issue #37，可选）。与 token-validate 的 client_ip 同源——
                    同一次 ClientIpResolver 解析结果（`gateway.client-ip.{enabled,trusted-proxies}`，
                    见安全契约「客户端 IP 解析」节）在 validate 跳与 resolve 跳双跳透传；
                    后端不得自行从请求头解析客户端 IP。null = 旧语义（能力面 ip 白名单既有
                    fail-closed 行为不变）；能力面 ip 白名单拒绝回 code=10612（网关默认透传
                    白名单 10612→403，见用户文档 通用约定 §4.1）。
      responses:
        '200':
          description: 候选列表（按 priority 降序 failover；无候选 code=10400）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/RouteData'

  /gw/v1/billing/pre-consume:
    post:
      tags: [billing]
      operationId: preConsume
      summary: 预扣（余额不足 code=10617；成功返回 pre_consume_id 供结算/退款引用）
      parameters:
        - $ref: '#/components/parameters/TraceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreConsumeRequest'
      responses:
        '200':
          description: 预扣结果
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [pre_consume_id, amount]
                        properties:
                          pre_consume_id:
                            type: string
                          amount:
                            type: string
                            description: 预扣金额（元，字符串）

  /gw/v1/billing/settle:
    post:
      tags: [billing]
      operationId: settle
      summary: 结算（按实际 usage 收支差额；按 pre_consume_id 幂等，重放返回首次结果）
      parameters:
        - $ref: '#/components/parameters/TraceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettleRequest'
      responses:
        '200':
          description: 结算结果
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [credit]
                        properties:
                          credit:
                            type: string
                            description: 实际消费金额（元，字符串）
                          balance:
                            type: string
                            nullable: true

  /gw/v1/billing/refund:
    post:
      tags: [billing]
      operationId: refund
      summary: 退款补偿（上游全失败/超时；按 pre_consume_id 幂等）
      parameters:
        - $ref: '#/components/parameters/TraceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pre_consume_id]
              properties:
                pre_consume_id:
                  type: string
                reason:
                  type: string
      responses:
        '200':
          description: 退款结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'

  /gw/v1/moderation/scan:
    post:
      tags: [moderation]
      operationId: scanModeration
      summary: 内容审核扫描（超时/5xx 由网关 fail-open 策略兜底，不重试拖慢主链路）
      parameters:
        - $ref: '#/components/parameters/TraceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content:
                  type: string
                content_type:
                  type: string
                  enum: [prompt, output]
                tenant_id:
                  type: string
      responses:
        '200':
          description: 审核结论
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [action]
                        properties:
                          action:
                            type: string
                            enum: [PASS, BLOCK, SANITIZE]
                          sanitized_content:
                            type: string
                            nullable: true
                            description: action=SANITIZE 时的替换内容
                          reason:
                            type: string
                            nullable: true

  /gw/v1/access-log/record:
    post:
      tags: [log]
      operationId: recordAccessLog
      summary: 访问日志落库（transport=rpc 时网关异步批量推送；不阻塞主链路）
      parameters:
        - $ref: '#/components/parameters/TraceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [entries]
              properties:
                entries:
                  type: array
                  maxItems: 100
                  items:
                    $ref: '#/components/schemas/AccessLogEntry'
      responses:
        '200':
          description: 受理结果
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          accepted:
                            type: integer
                          rejected:
                            type: integer

  /gw/v1/audit/record:
    post:
      tags: [log]
      operationId: recordAudit
      summary: 审计事件外发（安全/管理事件；失败不阻塞主链路；你侧 append-only 落库）
      parameters:
        - $ref: '#/components/parameters/TraceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuditEvent'
      responses:
        '200':
          description: 受理结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'

  /gw/v1/models:
    get:
      tags: [models]
      operationId: listModels
      summary: 模型目录（id 即调用方请求的 model 名）
      security:
        - apiKeyHeader: []
        - bearerJwt: []
        - internalTokenHeader: []
      parameters:
        - $ref: '#/components/parameters/TraceId'
      responses:
        '200':
          description: 目录
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [object, data]
                        properties:
                          object:
                            type: string
                            example: list
                          data:
                            type: array
                            items:
                              type: object
                              required: [id]
                              properties:
                                id:
                                  type: string
                                owned_by:
                                  type: string

  /gw/v1/task/create:
    post:
      # SPI 预留契约, 当前无实现, 任务执行=lotask4j 托管形态 (issue #29 定版)
      tags: [task]
      operationId: createTask
      summary: 任务创建委托（网关已生成 task_no 并完成全额预扣后下发；失败回业务 code，网关将退款并置 FAILED）
      parameters:
        - $ref: '#/components/parameters/TraceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [task_no, model]
              properties:
                task_no:
                  type: string
                  description: 网关生成的任务号（幂等键——重复请求返回首次结果）
                model:
                  type: string
                params:
                  type: object
                  additionalProperties: true
                  description: 模态参数（duration/resolution/input 等）
                notify_url:
                  type: string
                  nullable: true
                tenant_id:
                  type: string
      responses:
        '200':
          description: 受理结果
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [accepted]
                        properties:
                          accepted:
                            type: boolean
                          status:
                            type: string
                            enum: [PENDING, RUNNING]

  /gw/v1/task/poll:
    post:
      # SPI 预留契约, 当前无实现, 任务执行=lotask4j 托管形态 (issue #29 定版)
      tags: [task]
      operationId: pollTask
      summary: 任务轮询委托（只读；终态后网关停止轮询）
      parameters:
        - $ref: '#/components/parameters/TraceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [task_no]
              properties:
                task_no:
                  type: string
      responses:
        '200':
          description: 任务状态
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [status]
                        properties:
                          status:
                            type: string
                            enum: [PENDING, RUNNING, SUCCEEDED, FAILED, EXPIRED]
                          result:
                            type: object
                            nullable: true
                            additionalProperties: true
                            properties:
                              resources:
                                type: array
                                items:
                                  type: string
                                  description: 原始资源 URL（资源代理与 sig 签名由网关承接）
                              usage:
                                type: object
                                nullable: true
                                additionalProperties: true

  # ── Mmagix 形态内部 API（网关→控制层，非 /gw/v1/* 适配器契约）──
  # 网关经 route 面硬编码调用以下路径（HttpChannelApi，路径不可按 face 配置）；
  # openapi 适配器部署的控制层可按同 schema 在自选路径实现同语义端点。
  # 上报口径（issue #25 定版）：
  #   上游 200 → record-success；
  #   上游 4xx/5xx（含 200+错误载荷软失败）→ record-failure，errorCode=HTTP_<status>，
  #     并附 upstreamStatus（上游真实 HTTP 状态）与 latencyMs（本次上游调用耗时，毫秒）；
  #   客户端取消（499）→ 不上报（非渠道责任；预留 errorCode=CANCELLED 单列，未来上报也不计失败）。
  # 字段向后兼容：upstreamStatus/latencyMs 为可选新增，旧控制层忽略未知字段零影响。
  /api/v1/internal/channels/{channel_id}/record-success:
    post:
      tags: [channel-health]
      operationId: recordChannelSuccess
      summary: 渠道成功上报（网关在请求完结点 fire-and-forget 调用；无请求体）
      parameters:
        - name: channel_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 受理结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'

  /api/v1/internal/channels/{channel_id}/record-failure:
    post:
      tags: [channel-health]
      operationId: recordChannelFailure
      summary: 渠道失败上报（失败计数/冻结/亲和清除的唯一数据源；fire-and-forget）
      parameters:
        - name: channel_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordFailureRequest'
      responses:
        '200':
          description: 受理结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'

components:
  securitySchemes:
    apiKeyHeader:
      type: apiKey
      in: header
      name: X-API-Key
      description: 'auth=key：静态共享 key，恒定时间比较'
    bearerJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'auth=jwt：HS256 JWT（claims iss/caller/tenant_id/exp），换 secret 两端同步'
    internalTokenHeader:
      type: apiKey
      in: header
      name: X-Internal-Token
      description: 'auth=token：静态不透明令牌，恒定时间比较'

  parameters:
    TraceId:
      name: X-Trace-Id
      in: header
      required: false
      schema:
        type: string
      description: 必须透传，并回填信封 trace_id 同值

  schemas:
    Envelope:
      type: object
      description: 6 字段信封；code=0 成功，业务错误在 code（禁用 5xx 表达业务错误）
      required: [code, message, trace_id, timestamp]
      properties:
        code:
          type: integer
          description: 0=成功；10202 凭证无效 / 10400 无路由 / 10617 余额不足 / 101xx 参数错误
        message:
          type: string
        data:
          nullable: true
        error:
          type: array
          nullable: true
          items:
            type: object
            properties:
              field:
                type: string
                nullable: true
              code:
                type: string
                nullable: true
              message:
                type: string
        trace_id:
          type: string
        timestamp:
          type: integer
          format: int64

    TokenContextData:
      type: object
      required: [active]
      properties:
        tenant_id:
          type: string
        user_id:
          type: string
        sub_account_id:
          type: string
          description: 子账号 ID（可选，issue #27）；网关仅透传消费，不做存在性强依赖
        active:
          type: boolean
        masked_credential:
          type: string
          description: 掩码形态（日志展示用），不含明文

    RouteData:
      type: object
      required: [candidates]
      properties:
        candidates:
          type: array
          description: 按 priority 降序（1 最优），网关按序 failover
          items:
            type: object
            required: [base_url, protocol]
            properties:
              base_url:
                type: string
                description: 上游基地址（网关拼接协议路径）
              credential:
                type: string
                nullable: true
                description: 出站凭证；免鉴权渠道可为空
              credential_type:
                type: string
                enum: [plain, bearer]
                description: 出站凭证的携带方式
              protocol:
                type: string
                enum: [openai, anthropic]
                description: 上游原生协议（网关负责协议归一）
              model_mapping:
                type: object
                nullable: true
                description: 模型名映射（chat code → upstream code）；空 = 同名直转
              priority:
                type: integer

    PreConsumeRequest:
      type: object
      required: [trace_id, credential, model, prompt_tokens, completion_tokens]
      properties:
        trace_id:
          type: string
        credential:
          type: string
          description: 调用方凭证（脱敏引用由你的 token-validate 上下文关联）
        tenant_id:
          type: string
        model:
          type: string
        prompt_tokens:
          type: integer
          description: 估算 prompt tokens
        completion_tokens:
          type: integer
          description: 估算 completion tokens（max_tokens 启发）

    SettleRequest:
      type: object
      required: [pre_consume_id, prompt_tokens, completion_tokens]
      properties:
        pre_consume_id:
          type: string
        prompt_tokens:
          type: integer
          description: >-
            实际 usage（缺失时为估算值，issue #35 起经 usage_source=ESTIMATED 标记）
        completion_tokens:
          type: integer
        cached_tokens:
          type: integer
          description: 缓存读取 tokens（Anthropic cache_read_input_tokens /
            OpenAI prompt_tokens_details.cached_tokens）；含于 prompt_tokens（Anthropic 口径）
        cache_creation_tokens:
          type: integer
          description: >-
            缓存写入 tokens（Anthropic cache_creation_input_tokens，issue #26
            起独立成维不再并入 cached_tokens；含于 prompt_tokens）。旧字段，历史上恒 0，
            消费方按「缺省 0 = 未上报」兼容
        reasoning_tokens:
          type: integer
          nullable: true
          description: 推理 tokens（OpenAI completion_tokens_details.reasoning_tokens；
            留痕维，不参与计价；null = 上游未回报，不造数）
        audio_tokens:
          type: integer
          nullable: true
          description: 音频 tokens（OpenAI prompt/completion 两侧 audio_tokens 求和；
            留痕维，不参与计价；null = 上游未回报，不造数）
        latency_ms:
          type: integer
        usage_source:
          type: string
          enum: [UPSTREAM, ESTIMATED]
          nullable: true
          description: |
            usage 来源（issue #35，可选）：UPSTREAM = 上游实测 usage；ESTIMATED = 网关内容估算
            （#33 chars/4 口径）。取值对齐能力面 schema `usage_call_log.usage_source
            CHECK IN ('UPSTREAM','ESTIMATED')`；缺省 null = 旧语义（不上报来源）。
            网关赋值口径：LLM 流式无 usage → ESTIMATED；流式有 usage 与非流式 → UPSTREAM；
            任务面 → null。#23 重放保真携带（重放沿用首响原值）。

    AccessLogEntry:
      type: object
      required: [trace_id, model, path, status, ts]
      properties:
        trace_id:
          type: string
        ts:
          type: integer
          format: int64
          description: 请求完成时间戳（幂等键之一）
        tenant_id:
          type: string
        user_id:
          type: string
        model:
          type: string
        path:
          type: string
        prompt_tokens:
          type: integer
        completion_tokens:
          type: integer
        cached_tokens:
          type: integer
        reasoning_tokens:
          type: integer
          nullable: true
          description: >-
            推理 tokens 留痕（issue #26；不参与计价；null = 无源数据）
        audio_tokens:
          type: integer
          nullable: true
          description: >-
            音频 tokens 留痕（issue #26，两侧求和口径；null = 无源数据）
        cache_creation_tokens:
          type: integer
          nullable: true
          description: >-
            缓存写入 tokens 留痕（issue #26，与 cached_tokens 分离；
            null = 无源数据）
        credit:
          type: string
          nullable: true
        latency_ms:
          type: integer
        status:
          type: string
          description: SUCCESS / FAILED / BLOCKED 等
        usage_source:
          type: string
          enum: [UPSTREAM, ESTIMATED]
          nullable: true
          description: |
            usage 来源（issue #35，可选；枚举取值 / null 语义 / 网关赋值口径同
            SettleRequest.usage_source，对齐 `usage_call_log.usage_source` CHECK 约束；
            MQ 通道消息体与 AccessLogEntry 同构，同样携带）

    AuditEvent:
      type: object
      required: [action, ts]
      properties:
        action:
          type: string
          description: 事件名（TENANT_CREATE / API_KEY_DISABLE / MODERATION_BLOCK 等）
        ts:
          type: integer
          format: int64
        tenant_id:
          type: string
        actor:
          type: string
        target_type:
          type: string
          nullable: true
        target_id:
          type: string
          nullable: true
        detail:
          type: object
          nullable: true
          additionalProperties: true
        trace_id:
          type: string

    RecordFailureRequest:
      type: object
      description: >-
        渠道失败上报请求体（Mmagix 形态，字段 camelCase 与网关 Java 契约一致）；
        5 个基础字段为既有契约，upstreamStatus/latencyMs 为 issue #25 可选新增（向后兼容）
      required: [errorCode]
      properties:
        tenantId:
          type: string
          description: 调用方租户（token-validate 的 tenant_id）
        errorCode:
          type: string
          description: 'HTTP_<status>（上游真实状态）或 UPSTREAM_ERROR（超时/连接拒绝等无 HTTP 语义失败）；
            预留 CANCELLED（客户端取消，当前网关不上报，未来上报也不计失败）'
        errorMessage:
          type: string
        apiKeyId:
          type: string
          description: 触发失败的 API Key ID（亲和清除定位用）
        model:
          type: string
          description: 失败请求的模型编码（亲和 key 的 model 维度）
        upstreamStatus:
          type: integer
          description: 上游真实 HTTP 状态码（硬错误=上游响应状态；软失败=错误载荷 status 字段，
            缺省 502）；无 HTTP 语义的失败为 null。与 errorCode=HTTP_<status> 同口径
        latencyMs:
          type: integer
          format: int64
          description: 本次上游调用耗时（毫秒，网关侧 elapsed）；滑动窗口/半开判定建议采用
