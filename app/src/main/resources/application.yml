server:
  port: 9401
  netty:
    connection-timeout: 60s
    idle-timeout: 300s

spring:
  application:
    name: token-gateway

# face 部署分组 (设计方案 §9): llm=纯同步面(无数据库无本地盘, 弹性扩) /
# task=任务面(挂任务表库 + 资源缓存盘, M2.5) / all=单组合跑(默认, 小规模)
token-gateway:
  face: all
  # 协议形状适配器 (全局单选): mmagix | tokenhub | tokengo | openapi | custom:<spiName>
  adapter: mmagix
  # ---- MMagiX task 面接入 (#12): 三控制面同指 bootstrap, 预铸 JWT env 注入 (#R1: jwt 态
  # ---- X-Internal-Token=jwt-secret 字段值原样, 故此处配完整 JWT 而非 HS256 secret)
  route:
    distribute-path: ${TOKEN_GATEWAY_ROUTE_DISTRIBUTE_PATH:/api/v1/internal/work-channels/distribute}
    auth: ${TOKEN_GATEWAY_ROUTE_AUTH:jwt}
    jwt-secret: ${TOKEN_GATEWAY_ROUTE_JWT_SECRET:}
  token-validate:
    auth: ${TOKEN_GATEWAY_TOKEN_VALIDATE_AUTH:jwt}
    jwt-secret: ${TOKEN_GATEWAY_TOKEN_VALIDATE_JWT_SECRET:}
  billing:
    auth: ${TOKEN_GATEWAY_BILLING_AUTH:jwt}
    jwt-secret: ${TOKEN_GATEWAY_BILLING_JWT_SECRET:}
  # ---- 能力面寻址 (G1 SPI 装配收尾, 设计方案 §5.1): 每类服务独立 url/auth/超时,
  # ---- 可分离部署也可同指单体. 未配置 url 的面回退 gateway.backend.* (兼容窗口,
  # ---- 存量部署零配置迁移; 全部显式配置后可删 gateway.backend.*).
  # 单体形态示例 (七面同指 MMagiX):
  # route:
  #   url: http://localhost:9400
  #   auth: jwt
  #   jwt-secret: ${GW_JWT_SECRET:}        # 预铸 JWT 或 HS256 secret, env 注入禁入仓
  #   timeout: 3s
  # 分离形态示例 (审核服务独立 + fail-closed, G6):
  # moderation:
  #   enabled: true
  #   fail-open: false                     # 审核面故障时拦截 (合规优先); 缺省 true 放行
  #   url: http://moderation-svc:9420
  #   auth: key
  #   key: ${GW_MODERATION_KEY:}
  # 任务面 (face=task/all 生效; 《05》零改造接入, 平台前提 lotask4j V4+; 凭证环境变量注入禁入仓)
  task:
    lotask:
      url: ${LOTASK_URL:http://localhost:8080}
      auth: jwt
      tenant-name: ${LOTASK_TENANT_NAME:}
      jwt-secret: ${LOTASK_JWT_SECRET:}
      access-key: ${LOTASK_ACCESS_KEY:}
      sign-key: ${LOTASK_SIGN_KEY:}
      tenant-secret: ${LOTASK_TENANT_SECRET:}
      # 双值窗轮转 (G3, 已有机制): reset-secret 轮换 grace 期双钥 webhook 验签
      # (WebhookVerifier.activeSecrets 主/备依次), 存量载荷全部过期后删除备钥
      tenant-secret-previous: ${LOTASK_TENANT_SECRET_PREVIOUS:}
      webhook-callback-url: ${LOTASK_WEBHOOK_CALLBACK_URL:}
    snapshot-cipher-key: ${TGW_SNAPSHOT_CIPHER_KEY:}
    resource-sign-key: ${TGW_RESOURCE_SIGN_KEY:}
    # lotask submit 的 task_type 粒度: modality(默认, 零感知) | model (remote Worker 按
    # modelCode 拉单时配 model, issue #13; 切换后 timeouts 键须同步按模型编码建)
    # submit-task-type: modality
    # 任务计费面 (issue #31): 任务三端点独立寻址, 与 LLM 面计费契约互斥
    # (任务=全额 amount 直传+settle 确认制; LLM=token 估价+settle 四维重算退差)。
    # 逐字段缺省回退 token-gateway.billing.* 对应值 —— 不配即行为与现状一致。
    # (注意: 键必须随值一起注释 —— 空节点 billing: 会被 binder 当空字符串标量绑定失败)
    # billing:
    #   url: http://localhost:9400            # 缺省回退 billing.url
    #   path-prefix: /v1/internal/billing/task # 任务三端点前缀; 缺省回退 billing.path-prefix (通用 /api/v1/internal/billing)
    #   auth: jwt                              # jwt | key | none; 缺省回退 billing.auth
    #   jwt-secret: ${TG_TASK_BILLING_JWT}     # 或 internal-token: 平移态形态; 缺省回退 billing 凭证
    #   timeout: 5s                            # 缺省回退 billing.timeout
    timeouts:
      video: 2h
      image: 30m
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      password:
      timeout: 5s
      lettuce:
        pool:
          max-active: 32
          max-idle: 16
          min-idle: 4
  # 入站请求体上限 (base64 参考图等大载荷; submit 出站无网关侧上限, 随此边界)
  codec:
    max-in-memory-size: ${GATEWAY_MAX_BODY_SIZE:128MB}

# 主应用 RPC 目标 (兼容窗口: token-gateway.* 七面未配置 url 的面回退到此; 全部迁移后删除)
gateway:
  backend:
    url: ${GATEWAY_BACKEND_URL:http://localhost:9400}
    # 内部签名 JWT (auth=jwt 兼容形态): env 注入禁入仓 (G3).
    # 用 sign-internal-token.sh 铸造 (与后端 mmagix.internal-token.secret 同 secret);
    # dev- 前缀 = 本地无签名模式; 空 = 不发鉴权头 (仅 localhost).
    internal-token: ${GATEWAY_INTERNAL_TOKEN:}
    timeout: 10s

  # 渠道健康上报 (record-success/record-failure): off 时渠道健康信号缺失需在监控侧补偿
  health-report:
    enabled: true

  # 客户端 IP 解析 (issue #27): token-validate 请求体 clientIp 的填充策略.
  # X-Forwarded-For 首段客户端可任意伪造, 无脑取首位 = IP 白名单/风控被绕过;
  # trusted-proxies=0 恒取 TCP 对端 (防伪造默认); >0 表示前面有 N 层可信代理 (LB/Ingress),
  # XFF 从右往左跳过 N 个后取第一个, 缺失/耗尽/畸形回退 TCP 对端. 详见安全契约「客户端 IP 解析」.
  client-ip:
    enabled: true
    trusted-proxies: 0

  # 请求内渠道轮换 (移植 MMagiX gateway cffc1ea): 上游可重试失败 (5xx/401/429/断连) 时
  # record-failure + refund + excludeChannelIds re-distribute + 重新预扣;
  # enabled=false 退化为单渠道快速失败. 终态失败健康计数由 access-log 健康上报兜底.
  failover:
    enabled: true
    max-attempts: 3
    base-backoff-ms: 1000

  # LLM 面 settle/refund 失败兜底 (issue #23): 基础设施失败入 Redis ZSET tgw:billing:pending,
  # 定时按原参数重放 (幂等锚 preConsumeId); max-attempts 耗尽或业务拒绝 → [Billing-DeadLetter]
  # 结构化日志捞取重放. enabled=false 仅停扫描, 入队与死信不受影响.
  billing-reconcile:
    enabled: true
    interval: 30s
    max-attempts: 5
    base-backoff: 30s

  # 客户端错误契约 (issue #24): LLM 面 (/v1/chat/completions, /v1/messages 前缀) 错误响应形状.
  # envelope (默认) = 6 字段信封 (文档化既定契约); openai = {"error":{...}} 形状 (OpenAI SDK
  # 直接可解析)。任务面/内部端点恒为信封。切换前与接入方对齐契约 — 信封是既定公开契约,
  # 未对齐即切 openai 对存量接入方是 breaking。
  # error-shape: envelope
  # 能力面业务码透传白名单 (原码 → 透传 HTTP 状态; 与默认白名单按键合并, 同键覆盖):
  # distribute/preConsume 失败分支原码命中 → 客户端直接收原码 + 语义 HTTP 状态 (两种形状均
  # 生效); 未命中走既有映射 (10400·20103→404 / 10617→402 / 其余 502+10004)。白名单之外的
  # 原码不进网关公开错误码空间 (仅 message 文本残存)。默认: 4090→403, 10601→402,
  # 10602→404, 10603→404, 10402→409, 10612→403 (ip 白名单拒绝, issue #37)
  # error-passthrough-codes:
  #   4090: 403
  #   10601: 402

  # 上游请求头透传白名单 (issue #32): 默认空 = 不透传任何头 (fail-closed, 出站请求与历史版本
  # 逐字节一致)。开启后对流式/非流式、OpenAI/Anthropic 全部 LLM 上游调用点生效, 用途如
  # mock 上游 chaos 故障注入 (X-Mock-Fault: stream-cut-after=2):
  # upstream:
  #   passthrough-headers:
  #     - X-Mock-Fault     # 精确名
  #     - X-Mock-*         # 前缀通配 (以 * 结尾)
  # 黑名单硬编码、优先于白名单: Authorization / Cookie / Set-Cookie / Host / Content-Length /
  # X-API-Key / X-Internal-* (内部签名族) / Accept / anthropic-version 配置了也不透传;
  # 多值头只取第一个值 (防走私), 头名匹配大小写不敏感。

  # THMP 契约面影子双跑 (22 号 S2-W1): enabled=true 后旧 distribute 与中台 resolve 并行比对,
  # 结果只埋点不执行; secret 环境变量注入 (thmp_tenants 契约租户, 禁入仓).
  thmp:
    enabled: false
    base-url: http://localhost:9300
    client-id: thmp-mmagix-gw
    secret: ${THMP_CONTRACT_SECRET:}
    timeout: 3s
    cache-ttl: 30s
    negative-ttl: 15s
    # W3 灰度切流 (enabled=true 且名单非空才生效): 名单内 SKU 按 percent 确定性分桶走 THMP 候选,
    # 未命中/THMP 失败自动回旧 distribute; 一键回旧 = 清空 cutover-models. 密钥解密口令须与
    # THMP thmp.enc.passphrase 兜底口令一致 (BYOK 逐租户口令 = 未决#12 决议).
    cutover-models: []
    cutover-percent: 0
    # 密钥解密口令 (BYOK 逐租户口令优先): env 注入禁入仓 (G3, 原 dev 默认口令已移除)
    key-passphrase: ${THMP_CONTRACT_KEY_PASSPHRASE:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    root: INFO
    fun.commons.tokengateway: DEBUG
    org.springframework.web.reactive: INFO
