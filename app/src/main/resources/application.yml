server:
  port: 9401
  netty:
    connection-timeout: 60s
    idle-timeout: 300s

spring:
  application:
    name: token-gateway

# face 部署分组 (设计方案 §9): llm=纯同步面(无数据库无本地盘, 弹性扩) /
# task=任务面(挂任务表库 + 资源缓存盘, M2.5) / all=单组合跑(默认, 小规模)
token-gateway:
  face: all
  # 协议形状适配器 (全局单选): mmagix | tokenhub | tokengo | openapi | custom:<spiName>
  adapter: mmagix
  # ---- 能力面寻址 (G1 SPI 装配收尾, 设计方案 §5.1): 每类服务独立 url/auth/超时,
  # ---- 可分离部署也可同指单体. 未配置 url 的面回退 gateway.backend.* (兼容窗口,
  # ---- 存量部署零配置迁移; 全部显式配置后可删 gateway.backend.*).
  # 单体形态示例 (七面同指 MMagiX):
  # route:
  #   url: http://localhost:9400
  #   auth: jwt
  #   jwt-secret: ${GW_JWT_SECRET:}        # 预铸 JWT 或 HS256 secret, env 注入禁入仓
  #   timeout: 3s
  # 分离形态示例 (审核服务独立 + fail-closed, G6):
  # moderation:
  #   enabled: true
  #   fail-open: false                     # 审核面故障时拦截 (合规优先); 缺省 true 放行
  #   url: http://moderation-svc:9420
  #   auth: key
  #   key: ${GW_MODERATION_KEY:}
  # 任务面 (face=task/all 生效; 《05》零改造接入, 平台前提 lotask4j V4+; 凭证环境变量注入禁入仓)
  task:
    lotask:
      url: ${LOTASK_URL:http://localhost:8080}
      auth: jwt
      tenant-name: ${LOTASK_TENANT_NAME:}
      jwt-secret: ${LOTASK_JWT_SECRET:}
      access-key: ${LOTASK_ACCESS_KEY:}
      sign-key: ${LOTASK_SIGN_KEY:}
      tenant-secret: ${LOTASK_TENANT_SECRET:}
      # 双值窗轮转 (G3, 已有机制): reset-secret 轮换 grace 期双钥 webhook 验签
      # (WebhookVerifier.activeSecrets 主/备依次), 存量载荷全部过期后删除备钥
      tenant-secret-previous: ${LOTASK_TENANT_SECRET_PREVIOUS:}
      webhook-callback-url: ${LOTASK_WEBHOOK_CALLBACK_URL:}
    snapshot-cipher-key: ${TGW_SNAPSHOT_CIPHER_KEY:}
    resource-sign-key: ${TGW_RESOURCE_SIGN_KEY:}
    timeouts:
      video: 2h
      image: 30m
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      password:
      timeout: 5s
      lettuce:
        pool:
          max-active: 32
          max-idle: 16
          min-idle: 4
  codec:
    max-in-memory-size: 16MB

# 主应用 RPC 目标 (兼容窗口: token-gateway.* 七面未配置 url 的面回退到此; 全部迁移后删除)
gateway:
  backend:
    url: ${GATEWAY_BACKEND_URL:http://localhost:9400}
    # 内部签名 JWT (auth=jwt 兼容形态): env 注入禁入仓 (G3).
    # 用 sign-internal-token.sh 铸造 (与后端 mmagix.internal-token.secret 同 secret);
    # dev- 前缀 = 本地无签名模式; 空 = 不发鉴权头 (仅 localhost).
    internal-token: ${GATEWAY_INTERNAL_TOKEN:}
    timeout: 10s

  # 渠道健康上报 (record-success/record-failure): off 时渠道健康信号缺失需在监控侧补偿
  health-report:
    enabled: true

  # 请求内渠道轮换 (移植 MMagiX gateway cffc1ea): 上游可重试失败 (5xx/401/429/断连) 时
  # record-failure + refund + excludeChannelIds re-distribute + 重新预扣;
  # enabled=false 退化为单渠道快速失败. 终态失败健康计数由 access-log 健康上报兜底.
  failover:
    enabled: true
    max-attempts: 3
    base-backoff-ms: 1000

  # THMP 契约面影子双跑 (22 号 S2-W1): enabled=true 后旧 distribute 与中台 resolve 并行比对,
  # 结果只埋点不执行; secret 环境变量注入 (thmp_tenants 契约租户, 禁入仓).
  thmp:
    enabled: false
    base-url: http://localhost:9300
    client-id: thmp-mmagix-gw
    secret: ${THMP_CONTRACT_SECRET:}
    timeout: 3s
    cache-ttl: 30s
    negative-ttl: 15s
    # W3 灰度切流 (enabled=true 且名单非空才生效): 名单内 SKU 按 percent 确定性分桶走 THMP 候选,
    # 未命中/THMP 失败自动回旧 distribute; 一键回旧 = 清空 cutover-models. 密钥解密口令须与
    # THMP thmp.enc.passphrase 兜底口令一致 (BYOK 逐租户口令 = 未决#12 决议).
    cutover-models: []
    cutover-percent: 0
    # 密钥解密口令 (BYOK 逐租户口令优先): env 注入禁入仓 (G3, 原 dev 默认口令已移除)
    key-passphrase: ${THMP_CONTRACT_KEY_PASSPHRASE:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    root: INFO
    fun.commons.tokengateway: DEBUG
    org.springframework.web.reactive: INFO
